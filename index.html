<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="North Path Interactive explores stories and experiences across games, film, music, and books.">
  <meta name="theme-color" content="#ffffff">
  <title>North Path Interactive</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; color: #111; background: #fff; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
    .hero { width: min(100%, 650px); text-align: center; }
    .logo { display: block; width: min(100%, 570px); height: auto; margin: 0 auto; }
    h1 { margin: 22px 0 0; font-size: clamp(1.55rem, 4vw, 2.25rem); line-height: 1.2; letter-spacing: -.035em; font-weight: 650; }
    .about { max-width: 480px; margin: 16px auto 0; color: #444; font-size: clamp(1rem, 2.5vw, 1.08rem); line-height: 1.7; }
    .game-link { display: inline-block; margin-top: 28px; padding: 11px 18px; border: 1px solid #111; color: #111; text-decoration: none; font-size: .9rem; font-weight: 650; transition: background .15s, color .15s; }
    .game-link:hover, .game-link:focus-visible { color: #fff; background: #111; }
    .game-link:focus-visible { outline: 2px solid #111; outline-offset: 4px; }
    footer { margin-top: 58px; color: #666; font-size: .78rem; }
    @media (max-width: 520px) { main { padding: 36px 22px; } h1 { margin-top: 16px; } footer { margin-top: 45px; } }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <img class="logo" src="assets/north-path-logo.webp" alt="North Path Interactive" width="1536" height="1024">
      <h1 id="title">Stories worth getting lost in.</h1>
      <p class="about">North Path Interactive explores stories and experiences across games, film, music, novels, and wherever the next path leads.</p>
      <a class="game-link" href="/asteroid/">Play Asteroid <span aria-hidden="true">→</span></a>
      <footer>© 2026 North Path Interactive</footer>
    </section>
  </main>
</body>
</html>
