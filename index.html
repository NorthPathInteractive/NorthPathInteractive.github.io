<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="North Path Interactive — independent game and web development.">
  <meta name="theme-color" content="#090b10">
  <title>North Path Interactive</title>
  <style>
    :root{color-scheme:dark;--bg:#090b10;--text:#f5f7fb;--muted:#a7adba}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 50% 36%,#17142a 0,#0d1018 30%,var(--bg) 64%);color:var(--text)}
    main{min-height:100%;display:grid;place-items:center;padding:42px 24px}
    .hero{width:min(680px,100%);text-align:center}
    .logo-wrap{position:relative;width:min(290px,66vw);aspect-ratio:1;margin:0 auto 30px}
    .logo-wrap:before{content:"";position:absolute;inset:10%;border-radius:50%;background:linear-gradient(135deg,#00d9ff,#6b4dff,#ff3fb4,#ff9b32);filter:blur(45px);opacity:.16}
    .logo{position:relative;width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;box-shadow:0 24px 70px rgba(0,0,0,.45)}
    h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.04;letter-spacing:-.045em;margin:0 0 18px;font-weight:700}
    .tagline{font-size:clamp(1.15rem,3.5vw,1.45rem);line-height:1.45;margin:0 auto 18px;color:#e7e9ee}
    .about{max-width:570px;margin:0 auto;color:var(--muted);font-size:1rem;line-height:1.7}
    .games{margin:30px auto 0;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .game-link{display:inline-block;padding:12px 18px;border:1px solid #343947;border-radius:10px;color:#f5f7fb;text-decoration:none;background:rgba(255,255,255,.035);font-weight:650;letter-spacing:.01em;transition:.18s ease}
    .game-link:hover{transform:translateY(-2px);border-color:#626b80;background:rgba(255,255,255,.065)}
    footer{margin-top:54px;color:#666d79;font-size:.82rem;letter-spacing:.02em}
    @media (max-width:520px){main{padding:32px 22px}.logo-wrap{margin-bottom:26px}footer{margin-top:42px}}
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="logo-wrap">
        <img class="logo" src="https://avatars.githubusercontent.com/u/242273645?v=4" alt="North Path Interactive logo">
      </div>
      <h1 id="title">Games worth getting lost in.</h1>
      <p class="tagline">Independent game &amp; web development.</p>
      <p class="about">North Path Interactive is focused on old-school dungeon RPGs, modern web experiences, and whatever lies down the next path.</p>
      <div class="games"><a class="game-link" href="/asteroid/">Play Asteroid →</a></div>
      <footer>© 2026 North Path Interactive</footer>
    </section>
  </main>
</body>
</html>
