<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Explore the games, stories, music and experiments of North Path Interactive.">
<meta name="theme-color" content="#ffffff"><title>North Path Interactive — Projects</title>
<style>
:root{--ink:#111;--muted:#626262;--line:#d9d9d9;--paper:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.shell{width:min(1160px,calc(100% - 48px));margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}.brand{width:210px;display:block}.brand img{display:block;width:100%;height:auto}nav a{color:inherit;text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}nav a:hover{text-decoration:underline}.hero{padding:70px 0 65px;max-width:800px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#666}.hero h1{font-size:clamp(42px,7vw,76px);letter-spacing:-.055em;line-height:1.02;margin:17px 0}.hero p{max-width:590px;font-size:clamp(17px,2vw,20px);line-height:1.55;color:#444;margin:0}.project-head{border-top:1px solid #111;padding-top:22px;display:flex;justify-content:space-between;align-items:end;gap:20px}.project-head h2{font-size:clamp(26px,4vw,38px);letter-spacing:-.04em;margin:0}.project-head p{font-size:14px;color:#666;margin:8px 0 0}.filters{display:flex;flex-wrap:wrap;gap:8px;padding:30px 0 24px}.filters button{border:1px solid #ccc;background:white;color:#222;border-radius:999px;padding:9px 16px;cursor:pointer;font-size:12px;font-weight:700}.filters button[aria-pressed=true],.filters button:hover{background:#111;color:#fff;border-color:#111}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px 20px}.card{border:0;background:transparent;padding:0;text-align:left;color:inherit;cursor:pointer;font:inherit;min-width:0}.cover{aspect-ratio:1;background:#f3f3f3;border:1px solid #ddd;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;transition:transform .18s,border-color .18s}.card:hover .cover{transform:translateY(-4px);border-color:#111}.badge{position:absolute;top:12px;left:12px;background:#fff;border:1px solid #bbb;padding:6px 8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}.icon{width:46%;height:46%;fill:none;stroke:#141414;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.cover.dark{background:#181818}.cover.dark .icon{stroke:#fff}.cover.dark .badge{background:#181818;color:white;border-color:#777}.cover.lines{background:repeating-linear-gradient(45deg,#f3f3f3 0 16px,#eaeaea 16px 17px)}.cover.circle{background:radial-gradient(circle,#fff 0 22%,#ececec 22% 23%,#f8f8f8 23% 38%,#e5e5e5 38% 39%,#f4f4f4 39%)}.meta{padding:13px 1px}.meta h3{font-size:16px;margin:0 0 6px;letter-spacing:-.02em}.meta p{font-size:12px;color:#666;margin:0}.card:focus-visible,.filters button:focus-visible,.close:focus-visible,.project-link:focus-visible{outline:2px solid #111;outline-offset:4px}.hidden{display:none}footer{margin-top:80px;border-top:1px solid var(--line);padding:24px 0 32px;color:#666;font-size:12px}dialog{border:1px solid #bbb;padding:0;width:min(760px,calc(100% - 32px));max-height:90vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.65)}.dialog-inner{display:grid;grid-template-columns:1fr 1fr}.detail-cover{min-height:320px}.detail-copy{padding:38px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start}.detail-copy h2{font-size:32px;letter-spacing:-.04em;margin:12px 0}.detail-copy p{color:#555;line-height:1.65}.close{position:absolute;right:12px;top:12px;width:36px;height:36px;border:1px solid #aaa;background:#fff;font-size:22px;cursor:pointer;z-index:2}.project-link{display:inline-block;margin-top:12px;padding:12px 15px;background:#111;color:white;text-decoration:none;font-size:13px;font-weight:bold}.project-link:hover{background:#444}@media(max-width:800px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.shell{width:calc(100% - 32px)}.brand{width:170px}.hero{padding:48px 0}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 12px}.project-head{display:block}.dialog-inner{grid-template-columns:1fr}.detail-cover{min-height:0;max-height:260px;aspect-ratio:1.45}.detail-copy{padding:26px}.detail-copy h2{font-size:26px}.badge{font-size:8px;top:8px;left:8px}}
</style></head>
<body><div class="shell"><header><a class="brand" href="/" aria-label="North Path Interactive home"><img src="/assets/north-path-logo.webp" width="1536" height="1024" alt="North Path Interactive"></a><nav><a href="#projects">Projects</a></nav></header>
<main><section class="hero"><div class="eyebrow">North Path Interactive</div><h1>Stories worth<br>getting lost in.</h1><p>Games, film, music, novels, comics and experiments. A collection of ideas, worlds and experiences at different stages of the journey.</p></section>
<section id="projects"><div class="project-head"><div><div class="eyebrow">Explore the work</div><h2>Projects</h2><p>Select a cover to learn more.</p></div></div>
<div class="filters" role="group" aria-label="Filter projects"><button data-filter="all" aria-pressed="true">All</button><button data-filter="games" aria-pressed="false">Games</button><button data-filter="comics" aria-pressed="false">Comics</button><button data-filter="music" aria-pressed="false">Music &amp; audio</button><button data-filter="experiments" aria-pressed="false">Experiments</button></div><div class="grid" id="grid"></div></section></main><footer>© 2026 North Path Interactive</footer></div>
<dialog id="details" aria-labelledby="detail-title"><button class="close" aria-label="Close project details">×</button><div class="dialog-inner"><div id="detail-art" class="cover detail-cover"></div><div class="detail-copy"><div class="eyebrow" id="detail-type"></div><h2 id="detail-title"></h2><p id="detail-description"></p><a class="project-link" id="detail-link"></a></div></div></dialog>
<script>
const paths={moon:'<circle cx="48" cy="48" r="30"/><path d="M57 20a29 29 0 0 0 19 48A30 30 0 1 1 57 20Z"/><path d="M22 76h52M30 76V63m36 13V63"/>',path:'<path d="M12 75 37 29l11 18 10-28 26 56H12Z"/><path d="M35 75c4-12 19-15 20-25"/><path d="M68 17v10m-5-5h10"/>',asteroid:'<path d="m18 38 9-17 20-7 22 8 11 20-5 23-18 15-25-3-16-18Z"/><circle cx="38" cy="38" r="7"/><circle cx="62" cy="56" r="5"/><path d="M21 62 9 71m68-43 10-7"/>',audio:'<path d="M20 53v-8a28 28 0 0 1 56 0v8M20 51h10v20H20zM66 51h10v20H66zM39 43v11m9-19v27m9-21v15"/>',wave:'<path d="M8 48h9l6-21 10 42 9-49 10 56 9-45 8 30 6-13h13"/>',chroma:'<circle cx="48" cy="48" r="29"/><circle cx="48" cy="48" r="19"/><circle cx="48" cy="48" r="9"/><path d="M48 19v58M19 48h58"/>',comic:'<path d="M20 18h56v50H47L31 80V68H20Z"/><path d="M31 33h34M31 43h25M31 53h18"/>',map:'<path d="m13 24 23-9 24 9 23-9v57l-23 9-24-9-23 9Z M36 15v57M60 24v57"/><path d="m43 39 10 10m0-10L43 49"/>',tv:'<rect x="15" y="22" width="66" height="50" rx="7"/><rect x="22" y="29" width="43" height="35" rx="4"/><circle cx="73" cy="37" r="2"/><path d="M35 22 25 12m29 10 10-10M25 78h46"/>',flux:'<path d="m48 15 24 33-24 33-24-33Z M48 30l12 18-12 18-12-18Z"/><path d="M10 48h12m52 0h12"/>'};
const projects=[
{name:'The Minstrel',cat:'comics',type:'Comic',status:'Active',style:'lines',icon:'comic',description:'A sword-and-sorcery newspaper strip about a weary professional musician who keeps getting dragged into adventure.',url:'https://minstrelgigs.substack.com',action:'Read The Minstrel'},
{name:'Headspace',cat:'music',type:'Music / Audio archive',status:'Active',style:'dark',icon:'audio',description:'A late-night audio archive with recordings to explore.',url:'https://smithworx.vercel.app/projects/headspace/',action:'Explore Headspace'},
{name:'Frequency Lab',cat:'music',type:'Music / Experiment',status:'In development',style:'circle',icon:'wave',description:'A browser instrument for exploring frequency, chords, panning, vibrato and sequencing.',url:'https://northpathinteractive.github.io/dev/frequency-lab/',action:'Open project'},
{name:'Wanderer’s Path',cat:'games',type:'Game',status:'In development',style:'lines',icon:'path',description:'A sandbox RPG about exploration and discovery, with progress stored on your own device.',url:'https://northpathinteractive.github.io/WanderersPath/',action:'Open project'},
{name:'Chroma',cat:'experiments',type:'Interactive experiment',status:'Active',style:'circle',icon:'chroma',description:'Colour, sound and haptic feedback brought together in a tactile play space.',url:'https://northpathinteractive.github.io/dev/chroma/',action:'Open project'},
{name:'Midnight Crawl',cat:'games',type:'Game',status:'On hold',style:'dark',icon:'moon',description:'An exploration of old-school dungeon crawling and modern web play.',url:'https://northpathinteractive.github.io/dev/midnight-crawl/',action:'Open project'},
{name:'Audible RPGs',cat:'games',type:'Game / Audio',status:'In development',style:'dark',icon:'audio',description:'A headphone-first dungeon crawler designed around sound and touch.',url:'https://northpathinteractive.github.io/dev/audible-rpg/',action:'Open project'},
{name:'Parsec Flux',cat:'games',type:'Game',status:'In development',style:'dark',icon:'flux',description:'A North Path Interactive game project in development.',url:'https://northpathinteractive.github.io/dev/parsec-flux/',action:'Open project'},
{name:'Map Goblin',cat:'experiments',type:'Utility',status:'Active',style:'lines',icon:'map',description:'A browser-based mapping companion for dungeon crawlers and adventure games.',url:'https://northpathinteractive.github.io/mapper/',action:'Open Map Goblin'},
{name:'Basement TV',cat:'experiments',type:'Retro TV',status:'Complete',style:'lines',icon:'tv',description:'A retro television experience inspired by a basement from another era.',url:'https://basement-tv-smithworx.vercel.app',action:'Open Basement TV'},
];
const grid=document.querySelector('#grid'),dialog=document.querySelector('#details');let selected=null;
function art(p){return `<span class="badge">${p.status}</span><svg class="icon" viewBox="0 0 96 96" aria-hidden="true">${paths[p.icon]}</svg>`}
projects.forEach((p,i)=>{const button=document.createElement('button');button.className='card';button.dataset.cat=p.cat;button.setAttribute('aria-label',`Learn more about ${p.name}`);button.innerHTML=`<div class="cover ${p.style}">${art(p)}</div><div class="meta"><h3>${p.name}</h3><p>${p.type} · ${p.status}</p></div>`;button.addEventListener('click',()=>{selected=button;document.querySelector('#detail-art').className=`cover detail-cover ${p.style}`;document.querySelector('#detail-art').innerHTML=art(p);document.querySelector('#detail-type').textContent=`${p.type} · ${p.status}`;document.querySelector('#detail-title').textContent=p.name;document.querySelector('#detail-description').textContent=p.description;const link=document.querySelector('#detail-link');link.href=p.url;link.textContent=p.action+' ↗';dialog.showModal()});grid.append(button)});
document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hidden',button.dataset.filter!=='all'&&button.dataset.filter!==c.dataset.cat))}));document.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});dialog.addEventListener('close',()=>selected?.focus());
</script></body></html>
