<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020405">
<title>Asteroid — North Path Interactive</title>
<style>
  :root{color-scheme:dark;--ink:#eaffea;--dim:#79a67d;--hot:#fff7a8;--danger:#ff7272}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020405;color:var(--ink);font-family:"Courier New",monospace;touch-action:none;user-select:none}
  body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen;opacity:.45}
  #game{display:block;width:100vw;height:100dvh;background:radial-gradient(circle at center,#061108 0,#020604 48%,#000 100%)}
  #hud{position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;z-index:4;text-shadow:0 0 8px rgba(140,255,150,.5)}
  .top{display:flex;justify-content:space-between;gap:16px;font-size:clamp(13px,3.4vw,18px);letter-spacing:.08em}
  #level{text-align:center;font-weight:700}
  .bottom{display:grid;gap:7px;justify-items:center}
  #ammoText{font-size:12px;letter-spacing:.18em;color:var(--dim)}
  #ammo{width:min(330px,78vw);height:13px;border:1px solid #8fcf95;padding:2px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;box-shadow:0 0 10px rgba(120,255,130,.18)}
  #ammo span{background:transparent;transition:background .08s}
  #ammo span.used{background:var(--hot);box-shadow:0 0 8px rgba(255,247,168,.7)}
  #status{height:18px;font-size:13px;letter-spacing:.18em;color:var(--hot)}
  #overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle,#071209 0,#010302 68%,#000 100%);padding:24px;text-align:center}
  #overlay.hidden{display:none}
  .panel{width:min(520px,92vw)}
  .brand{font-size:12px;letter-spacing:.3em;color:var(--dim);margin-bottom:28px}
  h1{margin:0;font-size:clamp(44px,15vw,92px);line-height:.85;letter-spacing:-.07em;text-shadow:0 0 18px rgba(150,255,160,.3)}
  .sub{margin:24px auto 30px;max-width:390px;line-height:1.55;color:#aec7b0;font-size:14px}
  button{font:inherit;border:1px solid #b8f4bd;background:#071309;color:#eaffea;padding:15px 28px;min-width:190px;letter-spacing:.18em;font-weight:700;box-shadow:0 0 18px rgba(120,255,130,.13);cursor:pointer}
  button:active{transform:scale(.98);background:#102414}
  .tiny{margin-top:20px;color:#68836b;font-size:11px;line-height:1.5;letter-spacing:.04em}
  #flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:white;opacity:0}
  #flash.hit{animation:flash .12s ease-out}
  @keyframes flash{0%{opacity:.13}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="hud" aria-hidden="true">
  <div class="top"><div>SCORE <span id="score">00000</span></div><div id="level">WORLD 1-1</div><div>LIVES <span id="lives">3</span></div></div>
  <div></div>
  <div class="bottom"><div id="status"></div><div id="ammoText">FIRE / RELOAD METER</div><div id="ammo"><span></span><span></span><span></span><span></span><span></span></div></div>
</div>
<div id="overlay">
  <div class="panel">
    <div class="brand">NORTH PATH INTERACTIVE</div>
    <h1>ASTEROID</h1>
    <div class="sub">Your ship stays dead centre and rotates counter-clockwise. Tap anywhere to fire. You get five shots — then you reload. Time the shot.</div>
    <button id="start">START GAME</button>
    <div class="tiny">PHONE / TABLET: TAP &nbsp;•&nbsp; DESKTOP: CLICK OR SPACE</div>
  </div>
</div>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const levelEl = document.getElementById('level');
  const statusEl = document.getElementById('status');
  const ammoEls = [...document.querySelectorAll('#ammo span')];
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');
  const flash = document.getElementById('flash');

  let W=0,H=0,DPR=1,cx=0,cy=0,raf=0,last=0;
  let running=false, gameOver=false, score=0, lives=3, world=1, stage=1, kills=0;
  let angle=0, shots=0, reloading=false, reloadUntil=0, spawnTimer=0, nextSpawn=0;
  let bullets=[], asteroids=[], particles=[], stars=[];

  function resize(){
    DPR=Math.min(window.devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cx=W/2; cy=H/2;
    canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR); canvas.style.width=W+'px'; canvas.style.height=H+'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
    stars=Array.from({length:Math.floor((W*H)/11000)},()=>({x:Math.random()*W,y:Math.random()*H,a:.18+Math.random()*.55,r:Math.random()*1.2}));
  }
  addEventListener('resize',resize,{passive:true}); resize();

  function say(text, rate=2.2, pitch=1){
    try{
      if(!('speechSynthesis' in window)) return;
      const u=new SpeechSynthesisUtterance(text); u.rate=rate; u.pitch=pitch; u.volume=1;
      speechSynthesis.speak(u);
    }catch(e){}
  }

  function resetGame(){
    score=0;lives=3;world=1;stage=1;kills=0;angle=0;shots=0;reloading=false;bullets=[];asteroids=[];particles=[];spawnTimer=0;nextSpawn=700;gameOver=false;
    updateHud();
  }

  function difficulty(){
    const n=(world-1)*4+(stage-1);
    return {speed:42+n*4.5, spawn:Math.max(430,1200-n*55), sizeMin:18, sizeMax:36+Math.min(14,n), wobble:Math.min(.28,n*.015), target:5+stage*2+Math.min(8,(world-1)*2)};
  }

  function updateHud(){
    scoreEl.textContent=String(score).padStart(5,'0'); livesEl.textContent=lives; levelEl.textContent=`WORLD ${world}-${stage}`;
    ammoEls.forEach((el,i)=>el.classList.toggle('used',i<shots));
  }

  function spawnAsteroid(){
    const d=difficulty(); const side=Math.floor(Math.random()*4); let x,y;
    if(side===0){x=Math.random()*W;y=-45}else if(side===1){x=W+45;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+45}else{x=-45;y=Math.random()*H}
    const targetAngle=Math.atan2(cy-y,cx-x)+(Math.random()-.5)*d.wobble;
    const speed=d.speed*(.86+Math.random()*.32); const r=d.sizeMin+Math.random()*(d.sizeMax-d.sizeMin);
    const pts=9+Math.floor(Math.random()*4); const shape=[];
    for(let i=0;i<pts;i++) shape.push(.72+Math.random()*.36);
    asteroids.push({x,y,vx:Math.cos(targetAngle)*speed,vy:Math.sin(targetAngle)*speed,r,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.6,shape});
  }

  function fire(){
    if(!running||gameOver||reloading) return;
    const now=performance.now(); const speed=Math.max(W,H)*.95;
    const nose=22; bullets.push({x:cx+Math.cos(angle)*nose,y:cy+Math.sin(angle)*nose,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1.15});
    shots++; say('gay',3.2,1.05); updateHud();
    if(shots>=5){
      reloading=true; reloadUntil=now+1450; statusEl.textContent='RELOADING'; say('reload',1.9,.9);
    }
  }

  function explode(a){
    score+=100+stage*20; kills++; flash.classList.remove('hit'); void flash.offsetWidth; flash.classList.add('hit');
    for(let i=0;i<12;i++){const q=Math.random()*Math.PI*2,s=28+Math.random()*95;particles.push({x:a.x,y:a.y,vx:Math.cos(q)*s,vy:Math.sin(q)*s,life:.35+Math.random()*.55})}
    const d=difficulty();
    if(kills>=d.target){
      kills=0; asteroids=[]; bullets=[]; stage++;
      if(stage>4){stage=1;world++; say('world '+world,1.5,.9)} else say('level '+world+' '+stage,1.7,.95);
      statusEl.textContent=`WORLD ${world}-${stage}`; setTimeout(()=>{if(!reloading)statusEl.textContent=''},900); updateHud(); nextSpawn=900;
    }
  }

  function loseLife(){
    lives--; updateHud(); say(lives>0?`${lives} lives`:'game over',1.8,.85);
    if(lives<=0){gameOver=true;running=false;statusEl.textContent='GAME OVER'; setTimeout(showGameOver,800)}
  }

  function showGameOver(){
    overlay.classList.remove('hidden'); overlay.querySelector('h1').textContent='GAME OVER'; overlay.querySelector('.sub').innerHTML=`SCORE ${String(score).padStart(5,'0')}<br>REACHED WORLD ${world}-${stage}`; startBtn.textContent='PLAY AGAIN';
  }

  function update(dt,now){
    angle-=dt*(.72+Math.min(.45,(world-1)*.035));
    if(reloading&&now>=reloadUntil){reloading=false;shots=0;statusEl.textContent='READY';say('ready',2.5,1);updateHud();setTimeout(()=>{if(!reloading)statusEl.textContent=''},360)}
    const d=difficulty(); spawnTimer+=dt*1000; if(spawnTimer>=nextSpawn){spawnTimer=0;spawnAsteroid();nextSpawn=d.spawn*(.75+Math.random()*.5)}

    bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt}); bullets=bullets.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
    asteroids.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.rv*dt});
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);

    for(let bi=bullets.length-1;bi>=0;bi--){
      let hit=-1; for(let ai=asteroids.length-1;ai>=0;ai--){const a=asteroids[ai],b=bullets[bi];if((a.x-b.x)**2+(a.y-b.y)**2<(a.r+4)**2){hit=ai;break}}
      if(hit>=0){const a=asteroids[hit]; bullets.splice(bi,1);asteroids.splice(hit,1);explode(a)}
    }
    for(let i=asteroids.length-1;i>=0;i--){const a=asteroids[i]; if((a.x-cx)**2+(a.y-cy)**2<(a.r+17)**2){asteroids.splice(i,1);loseLife(); if(gameOver)break}}
  }

  function drawShip(){
    ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.strokeStyle='#dfffe2';ctx.lineWidth=2;ctx.shadowColor='#b8ffbd';ctx.shadowBlur=8;
    ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-13,-11);ctx.lineTo(-7,0);ctx.lineTo(-13,11);ctx.closePath();ctx.stroke();
    ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(-18,0);ctx.lineTo(-10,5);ctx.strokeStyle='#91c996';ctx.stroke();ctx.restore();
  }

  function draw(){
    ctx.clearRect(0,0,W,H);ctx.fillStyle='#010302';ctx.fillRect(0,0,W,H);
    for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#bde5bf';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(120,190,125,.08)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,Math.min(W,H)*.31,0,Math.PI*2);ctx.stroke();
    for(const a of asteroids){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);ctx.strokeStyle='#ccefd0';ctx.lineWidth=1.6;ctx.shadowColor='#8fff99';ctx.shadowBlur=4;ctx.beginPath();for(let i=0;i<a.shape.length;i++){const q=i/a.shape.length*Math.PI*2,r=a.r*a.shape[i],x=Math.cos(q)*r,y=Math.sin(q)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();ctx.restore()}
    ctx.fillStyle='#fff7a8';ctx.shadowColor='#fff7a8';ctx.shadowBlur=8;for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,2.2,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;
    ctx.strokeStyle='#8ee894';ctx.lineWidth=1;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.7);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke()}ctx.globalAlpha=1;
    drawShip();
  }

  function loop(t){
    const dt=Math.min(.033,(t-last||16)/1000); last=t; if(running)update(dt,t); draw(); raf=requestAnimationFrame(loop);
  }

  function startGame(){
    try{speechSynthesis.cancel()}catch(e){} resetGame(); overlay.classList.add('hidden'); running=true; last=performance.now(); statusEl.textContent='';
    say('Mark is',1.55,.9);
  }
  startBtn.addEventListener('click',startGame);
  canvas.addEventListener('pointerdown',e=>{e.preventDefault();fire()});
  addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fire()}});
  raf=requestAnimationFrame(loop);
})();
</script>
</body>
</html>
