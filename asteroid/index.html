<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020405">
<title>Asteroid — North Path Interactive</title>
<style>
:root{color-scheme:dark;--ink:#eaffea;--dim:#79a67d;--hot:#fff7a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020405;color:var(--ink);font-family:"Courier New",monospace;touch-action:none;user-select:none}body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:8;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.025) 0,rgba(255,255,255,.025) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen;opacity:.45}
#game{display:block;width:100vw;height:100dvh;background:radial-gradient(circle at center,#061108 0,#020604 48%,#000 100%)}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto 1fr auto;z-index:4;text-shadow:0 0 8px rgba(140,255,150,.5)}.top{display:flex;justify-content:space-between;gap:16px;font-size:clamp(13px,3.4vw,18px);letter-spacing:.08em}#level{text-align:center;font-weight:700}#subtitle{position:fixed;left:50%;top:calc(50% + 42px);transform:translateX(-50%);font-size:clamp(24px,7vw,48px);font-weight:700;letter-spacing:.12em;color:var(--hot);text-shadow:0 0 12px rgba(255,247,168,.65);opacity:0;transition:opacity .12s;white-space:nowrap}#subtitle.show{opacity:1}
#overlay{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle,#071209 0,#010302 68%,#000 100%);padding:24px;text-align:center}#overlay.hidden{display:none}.panel{width:min(520px,92vw)}.brand{font-size:12px;letter-spacing:.3em;color:var(--dim);margin-bottom:24px}h1{margin:0;font-size:clamp(44px,15vw,92px);line-height:.85;letter-spacing:-.07em;text-shadow:0 0 18px rgba(150,255,160,.3)}.overlayShip{width:110px;height:86px;margin:24px auto 2px;position:relative}.overlayShip svg{width:100%;height:100%;filter:drop-shadow(0 0 9px rgba(184,255,189,.55));animation:spinShip 8s linear infinite}.overlayCaption{min-height:46px;margin:3px 0 12px;font-size:clamp(24px,7vw,44px);font-weight:700;letter-spacing:.12em;color:var(--hot);text-shadow:0 0 12px rgba(255,247,168,.65);opacity:0;transition:opacity .12s}.overlayCaption.show{opacity:1}@keyframes spinShip{to{transform:rotate(-360deg)}}.sub{margin:12px auto 24px;max-width:390px;line-height:1.55;color:#aec7b0;font-size:14px}button{font:inherit;border:1px solid #b8f4bd;background:#071309;color:#eaffea;padding:15px 28px;min-width:190px;letter-spacing:.18em;font-weight:700;box-shadow:0 0 18px rgba(120,255,130,.13);cursor:pointer}button:active{transform:scale(.98);background:#102414}.tiny{margin-top:20px;color:#68836b;font-size:11px;line-height:1.5;letter-spacing:.04em}#flash{position:fixed;inset:0;z-index:3;pointer-events:none;background:white;opacity:0}#flash.hit{animation:flash .12s ease-out}@keyframes flash{0%{opacity:.13}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="game"></canvas><div id="flash"></div>
<div id="hud" aria-hidden="true"><div class="top"><div>SCORE <span id="score">00000</span></div><div id="level">WORLD 1-1</div><div>LIVES <span id="lives">3</span></div></div><div></div><div id="subtitle"></div></div>
<div id="overlay"><div class="panel"><div class="brand">NORTH PATH INTERACTIVE</div><h1>ASTEROID</h1><div class="overlayShip" aria-hidden="true"><svg viewBox="-30 -30 60 60"><path d="M20 0 L-13 -11 L-7 0 L-13 11 Z" fill="none" stroke="#dfffe2" stroke-width="2"/><path d="M-10 -5 L-18 0 L-10 5" fill="none" stroke="#91c996" stroke-width="2"/></svg></div><div id="overlayCaption" class="overlayCaption"></div><div class="sub">Your ship stays dead centre and rotates counter-clockwise. Tap anywhere to fire. Time the shot.</div><button id="start">START GAME</button><div class="tiny">PHONE / TABLET: TAP &nbsp;•&nbsp; DESKTOP: CLICK OR SPACE</div></div></div>
<script>
(()=>{const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),levelEl=document.getElementById('level'),subtitleEl=document.getElementById('subtitle'),overlay=document.getElementById('overlay'),overlayCaption=document.getElementById('overlayCaption'),startBtn=document.getElementById('start'),flash=document.getElementById('flash');let W=0,H=0,DPR=1,cx=0,cy=0,last=0,running=false,gameOver=false,score=0,lives=3,world=1,stage=1,kills=0,angle=0,spawnTimer=0,nextSpawn=0,bullets=[],asteroids=[],particles=[],stars=[],subtitleTimer=0,overlayCaptionTimer=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cx=W/2;cy=H/2;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:Math.floor((W*H)/11000)},()=>({x:Math.random()*W,y:Math.random()*H,a:.18+Math.random()*.55,r:Math.random()*1.2}))}addEventListener('resize',resize,{passive:true});resize();
function subtitle(text,ms=760){subtitleEl.textContent=text;subtitleEl.classList.add('show');clearTimeout(subtitleTimer);subtitleTimer=setTimeout(()=>subtitleEl.classList.remove('show'),ms)}
function overlaySubtitle(text,ms=1400){overlayCaption.textContent=text;overlayCaption.classList.add('show');clearTimeout(overlayCaptionTimer);overlayCaptionTimer=setTimeout(()=>overlayCaption.classList.remove('show'),ms)}
function say(text,rate=1.35,pitch=1,caption=text.toUpperCase(),where='game'){if(where==='overlay')overlaySubtitle(caption,1400);else subtitle(caption,760);try{if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.rate=rate;u.pitch=pitch;u.volume=1;speechSynthesis.speak(u)}catch(e){}}
function resetGame(){score=0;lives=3;world=1;stage=1;kills=0;angle=0;bullets=[];asteroids=[];particles=[];spawnTimer=0;nextSpawn=700;gameOver=false;updateHud()}
function difficulty(){const n=(world-1)*4+(stage-1);return{speed:42+n*4.5,spawn:Math.max(430,1200-n*55),sizeMin:18,sizeMax:36+Math.min(14,n),wobble:Math.min(.28,n*.015),target:5+stage*2+Math.min(8,(world-1)*2)}}function updateHud(){scoreEl.textContent=String(score).padStart(5,'0');livesEl.textContent=lives;levelEl.textContent=`WORLD ${world}-${stage}`}
function spawnAsteroid(){const d=difficulty(),side=Math.floor(Math.random()*4);let x,y;if(side===0){x=Math.random()*W;y=-45}else if(side===1){x=W+45;y=Math.random()*H}else if(side===2){x=Math.random()*W;y=H+45}else{x=-45;y=Math.random()*H}const targetAngle=Math.atan2(cy-y,cx-x)+(Math.random()-.5)*d.wobble,speed=d.speed*(.86+Math.random()*.32),r=d.sizeMin+Math.random()*(d.sizeMax-d.sizeMin),pts=9+Math.floor(Math.random()*4),shape=[];for(let i=0;i<pts;i++)shape.push(.72+Math.random()*.36);asteroids.push({x,y,vx:Math.cos(targetAngle)*speed,vy:Math.sin(targetAngle)*speed,r,rot:Math.random()*Math.PI*2,rv:(Math.random()-.5)*.6,shape})}
function fire(){if(!running||gameOver)return;const speed=Math.max(W,H)*.95,nose=22;bullets.push({x:cx+Math.cos(angle)*nose,y:cy+Math.sin(angle)*nose,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1.15});say('gay',1.55,1.02,'GAY')}
function explode(a){score+=100+stage*20;kills++;flash.classList.remove('hit');void flash.offsetWidth;flash.classList.add('hit');for(let i=0;i<12;i++){const q=Math.random()*Math.PI*2,s=28+Math.random()*95;particles.push({x:a.x,y:a.y,vx:Math.cos(q)*s,vy:Math.sin(q)*s,life:.35+Math.random()*.55})}const d=difficulty();if(kills>=d.target){kills=0;asteroids=[];bullets=[];stage++;if(stage>4){stage=1;world++;say('world '+world,1.25,.95,`WORLD ${world}`)}else say('level '+world+' '+stage,1.3,.98,`WORLD ${world}-${stage}`);updateHud();nextSpawn=900}}
function loseLife(){lives--;updateHud();if(lives<=0){gameOver=true;running=false;setTimeout(showGameOver,180)}}function showGameOver(){overlay.classList.remove('hidden');overlay.querySelector('h1').textContent='GAME OVER';overlay.querySelector('.sub').innerHTML=`SCORE ${String(score).padStart(5,'0')}<br>REACHED WORLD ${world}-${stage}`;startBtn.textContent='PLAY AGAIN';say('game over, you loser',1.15,.95,'GAME OVER, YOU LOSER','overlay')}
function update(dt){angle-=dt*(.72+Math.min(.45,(world-1)*.035));const d=difficulty();spawnTimer+=dt*1000;if(spawnTimer>=nextSpawn){spawnTimer=0;spawnAsteroid();nextSpawn=d.spawn*(.75+Math.random()*.5)}bullets.forEach(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt});bullets=bullets.filter(b=>b.life>0&&b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);asteroids.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.rot+=a.rv*dt});particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);for(let bi=bullets.length-1;bi>=0;bi--){let hit=-1;for(let ai=asteroids.length-1;ai>=0;ai--){const a=asteroids[ai],b=bullets[bi];if((a.x-b.x)**2+(a.y-b.y)**2<(a.r+4)**2){hit=ai;break}}if(hit>=0){const a=asteroids[hit];bullets.splice(bi,1);asteroids.splice(hit,1);explode(a)}}for(let i=asteroids.length-1;i>=0;i--){const a=asteroids[i];if((a.x-cx)**2+(a.y-cy)**2<(a.r+17)**2){asteroids.splice(i,1);loseLife();if(gameOver)break}}}
function drawShip(){ctx.save();ctx.translate(cx,cy);ctx.rotate(angle);ctx.strokeStyle='#dfffe2';ctx.lineWidth=2;ctx.shadowColor='#b8ffbd';ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(20,0);ctx.lineTo(-13,-11);ctx.lineTo(-7,0);ctx.lineTo(-13,11);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.moveTo(-10,-5);ctx.lineTo(-18,0);ctx.lineTo(-10,5);ctx.strokeStyle='#91c996';ctx.stroke();ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#010302';ctx.fillRect(0,0,W,H);for(const s of stars){ctx.globalAlpha=s.a;ctx.fillStyle='#bde5bf';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.globalAlpha=1;ctx.strokeStyle='rgba(120,190,125,.08)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,Math.min(W,H)*.31,0,Math.PI*2);ctx.stroke();for(const a of asteroids){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.rot);ctx.strokeStyle='#ccefd0';ctx.lineWidth=1.6;ctx.shadowColor='#8fff99';ctx.shadowBlur=4;ctx.beginPath();for(let i=0;i<a.shape.length;i++){const q=i/a.shape.length*Math.PI*2,r=a.r*a.shape[i],x=Math.cos(q)*r,y=Math.sin(q)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();ctx.restore()}ctx.fillStyle='#fff7a8';ctx.shadowColor='#fff7a8';ctx.shadowBlur=8;for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,2.2,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0;ctx.strokeStyle='#8ee894';ctx.lineWidth=1;for(const p of particles){ctx.globalAlpha=Math.max(0,p.life*1.7);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*.035,p.y-p.vy*.035);ctx.stroke()}ctx.globalAlpha=1;drawShip()}
function loop(t){const dt=Math.min(.033,(t-last||16)/1000);last=t;if(running)update(dt);draw();requestAnimationFrame(loop)}
function startGame(){try{speechSynthesis.cancel()}catch(e){}resetGame();overlay.querySelector('h1').textContent='ASTEROID';overlay.querySelector('.sub').textContent='Your ship stays dead centre and rotates counter-clockwise. Tap anywhere to fire. Time the shot.';startBtn.textContent='START GAME';overlayCaption.classList.remove('show');say('Mark is',1.15,.95,'MARK IS','overlay');setTimeout(()=>{overlay.classList.add('hidden');running=true;last=performance.now()},1200)}
startBtn.addEventListener('click',startGame);canvas.addEventListener('pointerdown',e=>{e.preventDefault();fire()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();fire()}});requestAnimationFrame(loop)})();
</script>
</body></html>
