<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>North Path Mapper</title>
<style>
:root{color-scheme:dark;--bg:#101419;--panel:#181e25;--panel2:#222a33;--line:#3a4550;--text:#eef3f7;--muted:#9eabb8;--accent:#e8a845;--cell:32px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font:13px/1.25 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 8px;cursor:pointer;min-height:32px}button.primary{background:var(--accent);color:#17120a;border-color:var(--accent);font-weight:700}button.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}input,textarea{background:#0d1115;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 7px;min-width:0}.app{height:100%;display:grid;grid-template-rows:42px minmax(0,1fr)}.top{display:flex;gap:6px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line);background:#141a20;min-width:0}.brand{font-weight:800;font-size:15px;white-space:nowrap}.top input{width:min(220px,24vw)}.status{font-size:11px;color:var(--muted);margin-left:auto;white-space:nowrap}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 310px;min-height:0;overflow:hidden}.mapPane{position:relative;min-width:0;min-height:0;background:#0a0e12}.mapwrap{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:42px 18px 18px}.map{display:grid;width:max-content;user-select:none;background:#0b0f13;border:1px solid #4d5965}.cell{width:var(--cell);height:var(--cell);border-right:1px solid #3f4a55;border-bottom:1px solid #3f4a55;display:grid;place-items:center;font-size:calc(var(--cell)*.42);position:relative;overflow:hidden}.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}.cell.note:after{content:'•';position:absolute;right:2px;top:-3px;color:#fff;font-size:10px}.floor{background:#ece8dc;color:#171717}.wall{background:#4b535d}.water{background:#3d7eaa}.forest{background:#4f7a4d}.door{background:#9b663a}.stairsup{background:#7a65a9}.stairsdown{background:#8c557b}.special{background:#b99a43}.void{background:#14191f}.mapbar{position:absolute;z-index:4;left:8px;top:7px;display:flex;gap:5px;align-items:center;background:#141a20e8;border:1px solid var(--line);border-radius:7px;padding:4px;backdrop-filter:blur(6px)}.mapbar button{min-width:34px;padding:4px 7px;min-height:28px}.zoomText{color:var(--muted);font-size:11px;min-width:36px;text-align:center}.side{min-height:0;overflow:hidden;border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto auto auto minmax(0,1fr);padding:8px;gap:7px}.section{border-bottom:1px solid #303943;padding-bottom:7px}.section:last-child{border-bottom:0;padding-bottom:0}.section h3{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 5px}.levels{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}.level{white-space:nowrap;min-height:28px}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tool{padding:4px 5px;min-height:30px;text-align:left;font-size:11px}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid #0008}.props{display:grid;grid-template-columns:1fr 1fr;gap:5px}.props label,.inspector label{font-size:10px;color:var(--muted)}.props input,.inspector input{width:100%;margin-top:2px}.full{grid-column:1/-1}.row{display:flex;gap:4px;flex-wrap:wrap}.row>*{flex:1}.inspector{display:grid;grid-template-rows:auto auto auto minmax(58px,1fr) auto auto;min-height:0}.coords{font-size:11px;color:var(--muted);margin:0 0 4px}.inspector textarea{width:100%;height:100%;min-height:58px;resize:none;margin-top:2px}.tiny{font-size:10px;color:var(--muted)}.danger{border-color:#744}
@media(max-width:760px){.app{grid-template-rows:38px minmax(0,1fr)}.brand{font-size:13px}.brand span{display:none}.top input{width:30vw}.top button{padding:4px 6px;min-height:28px;font-size:11px}.status{display:none}.workspace{grid-template-columns:minmax(0,1fr) 230px}.side{padding:6px;gap:5px}.tools{grid-template-columns:repeat(2,1fr)}.tool{font-size:10px}.mapwrap{padding:40px 12px 12px}}
@media(max-width:520px) and (orientation:landscape){.workspace{grid-template-columns:minmax(0,1fr) 196px}.brand{display:none}.top input{width:34vw}.side{font-size:11px}.props{grid-template-columns:1fr 1fr}.tool{padding:3px}.section h3{font-size:9px}.mapbar{left:5px;top:5px}.mapbar button{min-width:30px}}
@media(orientation:portrait) and (max-width:760px){html,body{overflow:hidden}.app{height:100%;grid-template-rows:38px minmax(0,1fr)}.top{overflow-x:auto;overflow-y:hidden}.top input{width:42vw;min-width:120px}.workspace{display:grid;grid-template-columns:1fr;grid-template-rows:minmax(44%,1fr) minmax(0,56%);overflow:hidden}.mapPane{border-bottom:1px solid var(--line);min-height:0}.side{border-left:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:block;padding:7px}.section{padding-bottom:8px;margin-bottom:8px}.section:last-child{margin-bottom:0}.tools{grid-template-columns:repeat(3,minmax(0,1fr))}.props{grid-template-columns:1fr 1fr}.inspector{display:block}.inspector textarea{height:82px}.mapwrap{padding:40px 10px 10px}.mapbar{left:5px;top:5px;max-width:calc(100% - 10px);overflow-x:auto}.mapbar button{min-width:30px;white-space:nowrap}}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">North Path Mapper <span>prototype</span></div>
  <input id="mapName" aria-label="Map name" value="My Game Map">
  <button id="newMap">New</button><button id="exportMap">Export</button><button id="importMap">Import</button>
  <input id="fileInput" type="file" accept="application/json,.json" hidden>
  <span id="saveStatus" class="status">Saved locally</span>
</header>
<main class="workspace">
  <section class="mapPane">
    <div class="mapbar" aria-label="Map navigation">
      <button id="panMode" title="Pan map with mouse or one finger">✋ Pan</button>
      <button id="zoomOut" title="Zoom out">−</button><span id="zoomText" class="zoomText">100%</span><button id="zoomIn" title="Zoom in">+</button>
      <button id="fitMap" title="Fit map in view">Fit</button>
    </div>
    <div class="mapwrap" id="mapwrap"><div id="map" class="map" aria-label="Dungeon map grid"></div></div>
  </section>
  <aside class="side">
    <section class="section">
      <h3>Levels</h3>
      <div class="levels" id="levels" aria-label="Map levels"></div>
      <div class="row" style="margin-top:4px"><button id="addLevel">+ Level</button><button id="duplicateLevel">Duplicate</button><button id="deleteLevel" class="danger">Delete</button></div>
    </section>
    <section class="section">
      <h3>Draw</h3>
      <div class="tools" id="tools">
        <button class="tool active" data-tool="floor"><span class="sw" style="background:#ece8dc"></span>Floor</button>
        <button class="tool" data-tool="wall"><span class="sw" style="background:#4b535d"></span>Wall</button>
        <button class="tool" data-tool="water"><span class="sw" style="background:#3d7eaa"></span>Water</button>
        <button class="tool" data-tool="forest"><span class="sw" style="background:#4f7a4d"></span>Forest</button>
        <button class="tool" data-tool="door"><span class="sw" style="background:#9b663a"></span>Door</button>
        <button class="tool" data-tool="stairsup">↑ Stairs</button>
        <button class="tool" data-tool="stairsdown">↓ Stairs</button>
        <button class="tool" data-tool="special">★ Special</button>
        <button class="tool" data-tool="void">✕ Erase</button>
      </div>
    </section>
    <section class="section">
      <h3>Level properties</h3>
      <div class="props">
        <label>Width X<input id="width" type="number" min="1" max="100" value="20"></label>
        <label>Height Y<input id="height" type="number" min="1" max="100" value="20"></label>
        <label class="full">Level name<input id="levelName" value="Level 1"></label>
        <button id="applyProps" class="primary full">Apply</button>
      </div>
    </section>
    <section class="section inspector">
      <h3>Selected square</h3>
      <p class="coords" id="coords">X 1 · Y 1</p>
      <label>Label<input id="cellLabel" maxlength="12" placeholder="e.g. SWORD"></label>
      <label style="display:block;margin-top:4px">Notes<textarea id="cellNote" placeholder="Secret door, encounter, item, clue..."></textarea></label>
      <div class="row" style="margin-top:4px"><button id="saveNote" class="primary">Save square</button><button id="clearSquare">Clear note</button></div>
      <div class="tiny" style="margin-top:4px">Draw mode paints. Pan mode lets one finger or mouse drag move the map. Wheel/trackpad scrolling also works.</div>
    </section>
  </aside>
</main>
</div>
<script>
(()=>{
const KEY='northPathMapper.v1',MIN_CELL=14,MAX_CELL=56;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
let tool='floor',painting=false,panning=false,panStart=null,selected={x:0,y:0},state,cellSize=32;
function blankLevel(name='Level 1',w=20,h=20){return {id:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),name,width:w,height:h,cells:{}}}
function defaultState(){return {version:1,name:'My Game Map',active:0,levels:[blankLevel()]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));return x&&x.levels?.length?x:defaultState()}catch{return defaultState()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state));$('#saveStatus').textContent='Saved locally';clearTimeout(save.t);save.t=setTimeout(()=>$('#saveStatus').textContent='Auto-save on',1200)}
function lvl(){return state.levels[state.active]}function key(x,y){return x+','+y}function cell(x,y){return lvl().cells[key(x,y)]||{type:'void',label:'',note:''}}
function setCellSize(n){cellSize=Math.max(MIN_CELL,Math.min(MAX_CELL,Math.round(n)));document.documentElement.style.setProperty('--cell',cellSize+'px');$('#zoomText').textContent=Math.round(cellSize/32*100)+'%'}
function renderLevels(){const n=$('#levels');n.innerHTML='';state.levels.forEach((l,i)=>{const b=document.createElement('button');b.className='level'+(i===state.active?' active':'');b.textContent=l.name;b.addEventListener('click',()=>{state.active=i;selected={x:0,y:0};render();save()});n.append(b)})}
function renderGrid(){const l=lvl(),m=$('#map');m.style.gridTemplateColumns=`repeat(${l.width}, var(--cell))`;m.innerHTML='';for(let y=0;y<l.height;y++)for(let x=0;x<l.width;x++){const d=cell(x,y),b=document.createElement('div');b.className=`cell ${d.type||'void'}${d.note?' note':''}${selected.x===x&&selected.y===y?' sel':''}`;b.dataset.x=x;b.dataset.y=y;b.setAttribute('role','button');b.setAttribute('tabindex','0');b.title=`X ${x+1}, Y ${y+1}${d.note?' — '+d.note:''}`;b.textContent=d.label||(d.type==='stairsup'?'↑':d.type==='stairsdown'?'↓':d.type==='special'?'★':'');m.append(b)}}
function renderInspector(){const l=lvl(),d=cell(selected.x,selected.y);$('#coords').textContent=`X ${selected.x+1} · Y ${selected.y+1}`;$('#cellLabel').value=d.label||'';$('#cellNote').value=d.note||'';$('#width').value=l.width;$('#height').value=l.height;$('#levelName').value=l.name;$('#mapName').value=state.name}
function render(){renderLevels();renderGrid();renderInspector()}
function paint(x,y){const l=lvl();if(x<0||y<0||x>=l.width||y>=l.height)return;const k=key(x,y),old=l.cells[k]||{};l.cells[k]={type:tool,label:old.label||'',note:old.note||''};if(tool==='void'&&!l.cells[k].label&&!l.cells[k].note)delete l.cells[k];selected={x,y};renderGrid();renderInspector();save()}
function setPan(on){panning=on;$('#panMode').classList.toggle('active',on);$$('.tool').forEach(b=>b.classList.toggle('active',!on&&b.dataset.tool===tool));$('#map').style.touchAction='none';$('#mapwrap').style.cursor=on?'grab':'crosshair'}
$('#map').addEventListener('pointerdown',e=>{const c=e.target.closest('.cell');if(panning){panStart={x:e.clientX,y:e.clientY,left:$('#mapwrap').scrollLeft,top:$('#mapwrap').scrollTop,id:e.pointerId};$('#map').setPointerCapture?.(e.pointerId);$('#mapwrap').style.cursor='grabbing';return}if(!c)return;painting=true;paint(+c.dataset.x,+c.dataset.y)});
$('#map').addEventListener('pointermove',e=>{if(panning&&panStart){$('#mapwrap').scrollLeft=panStart.left-(e.clientX-panStart.x);$('#mapwrap').scrollTop=panStart.top-(e.clientY-panStart.y);return}if(!painting)return;const el=document.elementFromPoint(e.clientX,e.clientY),c=el?.closest?.('.cell');if(c&&$('#map').contains(c))paint(+c.dataset.x,+c.dataset.y)});
function endPointer(){painting=false;panStart=null;if(panning)$('#mapwrap').style.cursor='grab'}window.addEventListener('pointerup',endPointer);window.addEventListener('pointercancel',endPointer);
$('#map').addEventListener('click',e=>{if(panning)return;const c=e.target.closest('.cell');if(!c)return;selected={x:+c.dataset.x,y:+c.dataset.y};renderGrid();renderInspector()});
$('#panMode').addEventListener('click',()=>setPan(!panning));
$('#tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;tool=b.dataset.tool;setPan(false)});
$('#zoomOut').addEventListener('click',()=>setCellSize(cellSize-4));$('#zoomIn').addEventListener('click',()=>setCellSize(cellSize+4));
$('#fitMap').addEventListener('click',()=>{const l=lvl(),w=$('#mapwrap').clientWidth-28,h=$('#mapwrap').clientHeight-54;setCellSize(Math.min(w/l.width,h/l.height,MAX_CELL));$('#mapwrap').scrollTo({left:0,top:0})});
$('#applyProps').addEventListener('click',()=>{const l=lvl(),w=Math.max(1,Math.min(100,parseInt($('#width').value)||20)),h=Math.max(1,Math.min(100,parseInt($('#height').value)||20)),name=$('#levelName').value.trim()||`Level ${state.active+1}`;l.width=w;l.height=h;l.name=name;for(const k of Object.keys(l.cells)){const [x,y]=k.split(',').map(Number);if(x>=w||y>=h)delete l.cells[k]}selected={x:Math.min(selected.x,w-1),y:Math.min(selected.y,h-1)};render();save()});
$('#mapName').addEventListener('change',()=>{state.name=$('#mapName').value.trim()||'Untitled Map';save()});
$('#saveNote').addEventListener('click',()=>{const l=lvl(),k=key(selected.x,selected.y),old=l.cells[k]||{type:'void'};const d={type:old.type||'void',label:$('#cellLabel').value.trim(),note:$('#cellNote').value.trim()};if(d.type==='void'&&!d.label&&!d.note)delete l.cells[k];else l.cells[k]=d;renderGrid();save()});
$('#clearSquare').addEventListener('click',()=>{$('#cellLabel').value='';$('#cellNote').value='';const k=key(selected.x,selected.y),d=lvl().cells[k];if(d){d.label='';d.note='';if(d.type==='void')delete lvl().cells[k]}renderGrid();save()});
function addLevel(){state.levels.push(blankLevel(`Level ${state.levels.length+1}`,20,20));state.active=state.levels.length-1;selected={x:0,y:0};render();save()}$('#addLevel').addEventListener('click',addLevel);
$('#duplicateLevel').addEventListener('click',()=>{const s=lvl(),copy=JSON.parse(JSON.stringify(s));copy.id=crypto.randomUUID?crypto.randomUUID():Date.now()+'';copy.name=s.name+' Copy';state.levels.splice(state.active+1,0,copy);state.active++;render();save()});
$('#deleteLevel').addEventListener('click',()=>{if(state.levels.length===1){alert('A map must have at least one level.');return}if(!confirm(`Delete ${lvl().name}?`))return;state.levels.splice(state.active,1);state.active=Math.max(0,state.active-1);selected={x:0,y:0};render();save()});
$('#newMap').addEventListener('click',()=>{if(!confirm('Start a new map? Export first if you want a backup of this one.'))return;state=defaultState();render();save()});
$('#exportMap').addEventListener('click',()=>{state.name=$('#mapName').value.trim()||state.name;const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.name.replace(/[^a-z0-9-_]+/gi,'-')||'map')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
$('#importMap').addEventListener('click',()=>$('#fileInput').click());$('#fileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!x.levels?.length)throw Error();state=x;state.active=Math.max(0,Math.min(state.active||0,state.levels.length-1));selected={x:0,y:0};render();save()}catch{alert('That file does not look like a North Path Mapper file.')}e.target.value=''});
state=load();render();setCellSize(32);setPan(false);
})();
</script>
</body>
</html>
