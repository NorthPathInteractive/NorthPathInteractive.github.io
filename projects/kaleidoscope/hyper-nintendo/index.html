<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#100e1b">
<title>Hyper Nintendo Instruments · Kaleidoscope</title>
<style>
:root{color-scheme:dark;--back:#100e1b;--panel:#191627;--line:#3c354f;--fg:#fbf3ff;--soft:#c5b7d1;--accent:#e1c3ff;--ink:#20152c;font:15px/1.45 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--fg);background:radial-gradient(ellipse at 76% 3%,#302043 0,transparent 44%),var(--back)}
main{width:min(100% - 36px,930px);margin:0 auto;padding:32px 0 55px}a{color:var(--soft);text-underline-offset:.24em}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #fff;outline-offset:3px}
.eyebrow,.readout,.key-label,.pattern-label,.scope-label{font:700 11px/1.4 ui-monospace,monospace;letter-spacing:.095em}
h1,h2,p{margin:0}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:29px}.readout{color:var(--accent);text-align:right}.readout strong{color:#fff;font-size:16px}
.eyebrow{color:#e2c7ef}h1{font-size:clamp(38px,8vw,74px);letter-spacing:-.075em;line-height:.95;margin:8px 0 14px}h1 span{color:#e5c5f9}.intro{color:var(--soft);margin-bottom:23px}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:0 0 15px}.tab{min-height:61px;padding:8px 5px;border-radius:10px;background:#1e1a2e;color:var(--soft);border:1px solid var(--line);font-weight:700;line-height:1.25}.tab span{display:block;color:inherit;opacity:.82;font:700 10px/1.4 ui-monospace,monospace;margin-top:3px}.tab[aria-current=true]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.rack{padding:clamp(14px,3.7vw,30px);background:linear-gradient(150deg,#231c36,var(--panel) 56%);border:1px solid #49405e;border-radius:19px;box-shadow:0 18px 50px #09071185}
.rack-head{display:grid;grid-template-columns:1fr minmax(170px,37%);gap:20px;margin-bottom:22px}.rack h2{color:var(--accent);font-size:clamp(24px,4.5vw,43px);letter-spacing:-.055em;line-height:1.05;margin:5px 0 9px}.description{color:var(--soft);max-width:48ch}.scope{position:relative;min-height:89px;border:1px solid #453859;border-radius:11px;background:#100d1c;overflow:hidden}.scope-label{position:absolute;top:8px;left:9px;color:#b6a5c8;z-index:1}.scope canvas{display:block;width:100%;height:100%;position:absolute}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px 15px;margin-bottom:19px}.transport{background:var(--accent);color:var(--ink);font-weight:800;border:0;padding:9px 13px;border-radius:7px}.controls label{color:var(--soft);display:flex;align-items:center;gap:7px}.controls input{accent-color:var(--accent)}#tempo{width:63px;padding:4px 5px;border-radius:6px;border:1px solid #5a4a6e;background:#161124;color:var(--fg)}#volume{width:70px}
.keys{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}.keys.drums{grid-template-columns:repeat(4,minmax(0,1fr))}.key{color:var(--ink);background:linear-gradient(#fcf2ff,#d9c3ee);min-height:89px;min-width:0;border:1px solid #e6d0fc;border-bottom:5px solid #9480ac;border-radius:7px;padding:8px 2px;display:grid;justify-items:center;align-content:space-between;touch-action:manipulation;font-weight:800}.keys.drums .key{min-height:63px}.key:hover,.key.hit,.key:active{background:var(--accent);box-shadow:0 0 13px var(--accent)}.key.hit,.key:active{transform:translateY(2px);border-bottom-width:3px}.key-label{opacity:.75}
.pattern{margin-top:20px;display:grid;gap:7px}.pattern[hidden]{display:none}.pattern-label{color:var(--soft)}.track{display:grid;grid-template-columns:58px repeat(16,minmax(0,1fr));gap:4px;align-items:center}.step{height:24px;min-width:0;padding:0;border:1px solid #605371;background:#211b32;border-radius:4px}.step[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}.step:nth-child(4n+2){box-shadow:-2px 0 #776487}.step.playhead{outline:1px solid #fff;outline-offset:1px}.status{color:var(--soft);font-size:12px;margin-top:15px;min-height:18px}
@media(max-width:600px){header{margin-bottom:24px}.rack-head{grid-template-columns:1fr;gap:12px}.scope{min-height:64px}.tab{font-size:11px;min-height:54px;padding:5px 2px}.tab span{font-size:9px}.key{min-height:67px;font-size:12px}.key-label{font-size:9px}.track{grid-template-columns:42px repeat(16,minmax(0,1fr));gap:3px}.step{height:23px}.controls{gap:8px 10px}.controls label{font-size:13px}}
</style>
</head>

<main>
<header><a href="../#chord-labs">← Instrument Library</a><div class="readout">TRACK TEMPO <strong>160</strong> BPM</div></header>
<p class="eyebrow">KALEIDOSCOPE · INSTRUMENT LIBRARY</p>
<h1>Hyper <span>Nintendo</span></h1>
<p class="intro">Play the synths and drum sounds from the track.</p>
<nav id="instruments" aria-label="Choose an instrument"></nav>
<section class="rack" aria-labelledby="instrument-name">
  <div class="rack-head">
    <div><p class="eyebrow" id="voice-type"></p><h2 id="instrument-name"></h2><p class="description" id="description"></p></div>
    <div class="scope" aria-hidden="true"><span class="scope-label">OUTPUT</span><canvas width="350" height="100"></canvas></div>
  </div>
  <div class="controls">
    <button class="transport" id="transport" type="button">Play pattern</button>
    <label>Tempo <input id="tempo" type="number" min="50" max="220" step="1" value="160" inputmode="numeric"></label>
    <label><input id="orbit" type="checkbox"> Headphone effects</label>
    <label>Volume <input id="volume" type="range" min="0" max="1" step=".01" value=".58"></label>
  </div>
  <div class="keys" id="keys" aria-label="Play notes"></div>
  <div id="pattern" class="pattern"></div>
  <p class="status" id="status" role="status">Tap a key or use the letter shown on it.</p>
</section>
</main>

          wave=Math.sin(p)-Math.sin(3*p)/9+Math.sin(5*p)/25+.18*Math.sin(2*p)*Math.exp(-t*11);
        }else{
          const p=tau*f*(1+side*.0016)*t+.5*voice;
          wave=(Math.sin(p)+.19*Math.sin(2*p))*(.83+.17*Math.sin(t*(4+.4*voice)+side))*.23;
        }
        channel[i]+=wave*envelope(t,total,attack,release);
      }
    }
  }
  if(cache.size>160) cache.delete(cache.keys().next().value);
  cache.set(index,buffer);
  return buffer;
}
function route(buffer, when, gain, pan=0, orbitPeriod=0) {
  const source=context.createBufferSource();
  const balance=context.createStereoPanner();
  const level=context.createGain();
  source.buffer=buffer;
  balance.pan.value=pan;
  if(orbitPeriod) {
    const curve=Float32Array.from({length:32},(_,i)=>.94*Math.sin(tau*(when+i*buffer.duration/31)/orbitPeriod));
    balance.pan.setValueCurveAtTime(curve,when,buffer.duration);
  }
  level.gain.value=gain;
  source.connect(level).connect(balance).connect(bus);
  scheduled.add(source);
  source.onended=()=>{
    scheduled.delete(source);
    source.disconnect();
    level.disconnect();
    balance.disconnect();
  };
  source.start(when);
}
function playVoice(kind, note, when, length, options={}) {
  const buffer=kind==="drums"?drumBuffers[note]:bufferFor(kind,note,length,options.harmony);
  const gain={arp:.23,lead:.27,bass:.34,pad:.23,drums:[.53,.46,.22,.20][note]}[kind]*(options.gain??1);
  const beat=secondsPerBeat();
  route(buffer,when,gain,options.pan??0);
  if(kind==="arp"){
    for(const [offset,level,pan] of [[.75,.33,.58],[1.5,.17,-.58],[2.25,.08,.58]]) route(buffer,when+offset*beat,gain*level,pan);
  }
  if(kind==="lead"){
    route(buffer,when+.75*beat,gain*.20,.57);
    route(buffer,when+1.5*beat,gain*.10,-.52);
  }
  if($("orbit").checked && (kind==="arp" || kind==="lead" || kind==="pad")){
    for(const [offset,level,period] of [[.125,.59,2],[.375,.41,3],[.75,.30,5],[1.5,.21,7]]){
      route(buffer,when+beat*offset,gain*level*(kind==="arp"?1:.55),0,beat*period);
    }
  }
}
function stop() {
  sequence++;
  playing=false;
  clearInterval(timer);
  for(const timeout of pending) clearTimeout(timeout);
  pending.clear();
  for(const source of scheduled) source.stop();
  $("transport").textContent="Play pattern";
  document.querySelectorAll(".playhead").forEach(step=>step.classList.remove("playhead"));
}
function button(text,cls,callback) {
  const el=document.createElement("button");
  el.type="button";
  el.className=cls;
  el.textContent=text;
  el.addEventListener("click",callback);
  return el;
}
function selectInstrument(id) {
  if(!Object.hasOwn(instruments,id)) id="arp";
  stop();
  selected=id;
  const preset=instruments[id];
  document.documentElement.style.setProperty("--accent",preset.color);
  $("voice-type").textContent=preset.kind;
  $("instrument-name").textContent=preset.name;
  $("description").textContent=preset.description;
  $("status").textContent="Tap a key or use the letter shown on it.";
  $("keys").classList.toggle("drums",id==="drums");
  $("keys").replaceChildren();
  $("instruments").querySelectorAll("button").forEach(el=>el.setAttribute("aria-current",String(el.dataset.instrument===id)));
  (preset.names??preset.notes.map(MIDI)).forEach((name,i)=>{
    const key=button(name,"key",()=>audition(i));
    key.setAttribute("aria-keyshortcuts",letters[i].toUpperCase());
    key.setAttribute("aria-label","Play "+name);
    const hint=document.createElement("span");
    hint.className="key-label";
    hint.textContent=letters[i].toUpperCase();
    key.append(hint);
    $("keys").append(key);
  });
  $("pattern").replaceChildren();
  $("pattern").hidden=!(id in steps);
  if(!(id in steps)) return;
  steps[id].forEach((row,track)=>{
    const group=document.createElement("div");
    group.className="track";
    const name=document.createElement("span");
    name.className="pattern-label";
    name.textContent=id==="arp"?"Arp":["Kick","Snare","Closed","Open"][track];
    group.append(name);
    row.forEach((hit,i)=>{
      const step=button("","step",()=>{
        row[i]=!row[i];
        step.setAttribute("aria-pressed",String(row[i]));
      });
      step.setAttribute("aria-label",name.textContent+" step "+(i+1));
      step.setAttribute("aria-pressed",String(hit));
      step.dataset.step=i;
      group.append(step);
    });
    $("pattern").append(group);
  });
}
async function ready() {
  try {await audio(); return true;}
  catch { $("status").textContent="Audio could not start. Try tapping the instrument again."; return false; }
}
async function audition(i) {
  const id=selected;
  const preset=instruments[id];
  if(i>=(preset.names??preset.notes).length || !(await ready()) || id!==selected) return;
  playVoice(id,preset.notes?.[i]??i,context.currentTime+.012,{arp:.135,lead:.57,bass:.36,pad:1.45,drums:0}[id]);
  const key=$("keys").children[i];
  key.classList.add("hit");
  setTimeout(()=>key.classList.remove("hit"),110);
}
function renderStep(step,when) {
  const id=selected;
  const beat=secondsPerBeat();
  const column=step%16;
  const bar=Math.floor(step/16)%4;
  if(id==="arp" && steps.arp[0][column]){
    playVoice(id,instruments.arp.notes[arpOrder[column]],when,.135,{gain:column%4===0?1:.65,pan:.74*Math.sin(column*.65)});
  }else if(id==="drums"){
    steps.drums.forEach((row,index)=>{
      if(row[column]) playVoice(id,index,when,0,{pan:index===2?-.24:index===3 ? .21 : 0});
    });
  }else if(id==="lead"){
    for(const [offset,note,length] of hook[bar]){
      if(Math.round(offset*4)!==column) continue;
      playVoice(id,note,when,length*beat);
      if(length>=.64) playVoice(id,note-(bar===3?12:7),when,length*beat,{harmony:true,gain:.27,pan:.28});
    }
  }else if(id==="bass"){
    for(const [offset,length,interval] of bassPattern){
      if(Math.round(offset*4)===column) playVoice(id,[37,33,40,35][bar]+interval,when,length*beat,{gain:interval ? .63 : 1});
    }
  }else if(id==="pad" && column===0){
    playVoice(id,instruments.pad.notes[bar],when,4*beat);
  }
  if(id in steps){
    const token=setTimeout(()=>{
      pending.delete(token);
      document.querySelectorAll(".step").forEach(el=>el.classList.toggle("playhead",Number(el.dataset.step)===column));
    },Math.max(0,(when-context.currentTime)*1000));
    pending.add(token);
  }
}
function schedule() {
  if(nextTime<context.currentTime-.1) nextTime=context.currentTime+.02;
  while(nextTime<context.currentTime+.10){
    renderStep(nextStep,nextTime);
    nextStep=(nextStep+1)%64;
    nextTime+=secondsPerBeat()/4;
  }
}
function drawScope() {
  const canvas=document.querySelector("canvas");
  const g=canvas.getContext("2d");
  const waveform=new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(waveform);
  g.clearRect(0,0,canvas.width,canvas.height);
  g.strokeStyle="#413751";
  g.beginPath();
  for(let x=0;x<=canvas.width;x+=25){g.moveTo(x,0);g.lineTo(x,canvas.height)}
  g.moveTo(0,60);g.lineTo(canvas.width,60);g.stroke();
  g.lineWidth=1.5;
  g.strokeStyle=instruments[selected].color;
  g.beginPath();
  waveform.forEach((value,i)=>{
    const x=i*canvas.width/(waveform.length-1);
    const y=60-(value-128)*.51;
    if(i===0) g.moveTo(x,y); else g.lineTo(x,y);
  });
  g.stroke();
  requestAnimationFrame(drawScope);
}
$("transport").addEventListener("click",async()=>{
  if(playing){stop();return}
  const token=++sequence;
  const id=selected;
  if(!(await ready()) || sequence!==token || selected!==id) return;
  playing=true;
  nextStep=0;
  nextTime=context.currentTime+.055;
  $("transport").textContent="Stop pattern";
  schedule();
  timer=setInterval(schedule,25);
});
$("volume").addEventListener("input",()=>{
  if(master) master.gain.setTargetAtTime(Number($("volume").value),context.currentTime,.012);
});
$("tempo").addEventListener("change",()=>{$("tempo").value=tempo()});
document.addEventListener("keydown",event=>{
  if(event.repeat||event.altKey||event.ctrlKey||event.metaKey||event.target.matches("input,select,textarea,[contenteditable]")) return;
  const key=letters.indexOf(event.key.toLowerCase());
  if(key>=0){event.preventDefault();audition(key)}
});
for(const [id,preset] of Object.entries(instruments)){
  const tab=button(preset.tab,"tab",()=>{location.hash=id});
  tab.dataset.instrument=id;
  $("instruments").append(tab);
}
window.addEventListener("hashchange",()=>selectInstrument(location.hash.slice(1)));
selectInstrument(location.hash.slice(1));
</script>
</body>
